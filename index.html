${stage==='idle'&&h`<${Btn} className="mt-6" onClick=${()=>patch({is_candle_lit:true})}>🔥 Light the match<//>`}
${stage==='lit'&&h`<${Btn} className="mt-6" onClick=${()=>patch({is_candle_lit:false})}>💨 Blow (or use your mic)<//>`}
${stage==='blown'&&h`<p className="mt-4 text-sm text-amber-100/70">Drag the knife across the cake →</p>`}</div>`}
function Note({room,next}){
const [open,setOpen]=useState(false);const f=room.font_style;
return h`<div className="text-center w-full max-w-sm pop">${!open?h`<div className=${'relative rounded-2xl p-10 pt-16 shadow-[0_0_50px_rgba(251,191,36,0.25)] '+ENV[room.envelope_style]}><div className="absolute inset-x-0 top-0 h-1/2 opacity-30" style=${{clipPath:'polygon(0 0,100% 0,50% 100%)',background:'currentColor'}}/>
<p className="mb-6 text-sm opacity-80">A letter for ${room.receiver_name}</p>
<button onClick=${()=>{setOpen(true);beep(200,.2,'square',.1);confetti()}} className="text-6xl hover:scale-110 active:scale-90 transition" aria-label="Break the seal">${SEAL[room.envelope_style]}</button><p className="mt-3 text-xs opacity-70">Tap the seal</p></div>`
:h`<div className=${'rounded-2xl p-7 pop '+ENV[room.envelope_style]}><p className="text-xl leading-relaxed whitespace-pre-wrap" style=${{fontFamily:FONTS[f]}}>${room.secret_note||'Wishing you the most wonderful '+OCC[room.occasion][1]+'!'}</p><p className="mt-5 text-right" style=${{fontFamily:FONTS[f]}}>— ${room.sender_name||'Someone special'}</p></div><${Btn} className="mt-5" onClick=${next}>Get your souvenir →<//>`}</div>`}
function Souvenir({room}){
const ref=useRef();const shot=()=>html2canvas(ref.current,{backgroundColor:null,scale:2});
const dl=async()=>{const c=await shot(),a=document.createElement('a');a.download='celebration-card.png';a.href=c.toDataURL();a.click()};
const share=async()=>{const c=await shot(),msg='A special '+OCC[room.occasion][1]+' surprise for '+room.receiver_name+'!';c.toBlob(async b=>{try{const f=new File([b],'card.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:msg});else await navigator.share({text:msg,url:location.href})}catch(e){}})};
return h`<div className="text-center w-full max-w-xs pop">
<div ref=${ref} className="p-4 rounded-3xl bg-gradient-to-b from-[#1b1233] to-black border-4 border-amber-400/70"><div className="rounded-xl overflow-hidden border border-amber-300/50"><img src=${room.photo_url} className="w-full aspect-square object-cover"/></div>
<div className="mt-3 inline-block px-3 py-1 rounded-full bg-amber-400 text-black text-xs font-semibold">${OCC[room.occasion][0]} ${OCC[room.occasion][1]}</div>
<h3 className=${'text-xl mt-2 '+GOLD} style=${{fontFamily:"'Cinzel',serif"}}>${room.receiver_name}</h3><p className="text-xs text-amber-100/70">With love from ${room.sender_name||'a friend'}</p><p className="text-[10px] text-amber-100/40 mt-1">${new Date().toLocaleString()}</p></div>
<div className="flex gap-3 justify-center mt-5"><${Btn} onClick=${dl}>⬇ Download<//><${Btn} onClick=${share}>↗ Share<//></div></div>`}
/* ---------- Experience & App ---------- */
function Experience({room,patch}){
const steps=stepsOf(room),[i,setI]=useState(0),s=steps[i],next=()=>setI(x=>Math.min(x+1,steps.length-1)),p={room,patch,next};
return h`<div className="w-full flex flex-col items-center gap-6"><div className="flex gap-2">${steps.map((_,k)=>h`<div key=${k} className=${'h-1.5 rounded-full transition-all '+(k===i?'w-8 bg-amber-400':'w-3 bg-amber-300/30')}/>`)}</div>
${s==='puzzle'?h`<${Puzzle} ...${p}/>`:s==='vault'?h`<${Vault} ...${p}/>`:s==='cake'?h`<${Cake} ...${p}/>`:s==='note'?h`<${Note} ...${p}/>`:h`<${Souvenir} room=${room}/>`}</div>`}
function App(){
const [id,setId]=useState(location.hash.slice(1));const [room,patch]=useRoom(id);const [mode,setMode]=useState('land');const [go,setGo]=useState(false);const [code,setCode]=useState('');
useEffect(()=>{const f=()=>{setId(location.hash.slice(1));setGo(false)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
const create=async r=>{try{localStorage.setItem('room_'+r.id,JSON.stringify(r))}catch(e){}if(sb)sb.from('rooms').insert(r).then(()=>{},()=>{});location.hash=r.id;setMode('land')};
let body;
if(!id)body=mode==='setup'?h`<${Setup} onCreate=${create} onBack=${()=>setMode('land')}/>`:h`<div className=${GLASS+' p-8 text-center w-full max-w-sm pop'}><div className="text-6xl float mb-3">🎁</div><h1 className=${'text-2xl mb-5 '+GOLD} style=${{fontFamily:"'Cinzel',serif"}}>Celebration Room</h1>
<${Btn} className="w-full" onClick=${()=>setMode('setup')}>Create a surprise<//><div className="flex gap-2 mt-5"><input className=${IN} placeholder="Room code e.g. bd-9876" value=${code} onInput=${e=>setCode(e.target.value.trim())}/><${Btn} className="!px-4" onClick=${()=>code&&(location.hash=code)}>Join<//></div></div>`;
else if(!room)body=h`<div className=${GLASS+' p-8 text-center'}><p>Looking for room <b>${id}</b>…</p><button className="mt-4 text-amber-200 text-sm" onClick=${()=>{location.hash='';setId('')}}>← Back</button></div>`;
else if(!go)body=h`<div className=${GLASS+' p-8 sm:p-10 text-center w-full max-w-md pop border-2'}><div className="text-7xl float mb-4">${OCC[room.occasion][0]}</div>
<h1 className=${'text-2xl sm:text-3xl font-bold leading-snug '+GOLD} style=${{fontFamily:"'Cinzel',serif",filter:'drop-shadow(0 0 12px rgba(251,191,36,.5))'}}>✨ A Special Surprise for ${room.receiver_name}! ✨</h1>
<p className="mt-3 text-amber-100/80">Celebrating your special ${OCC[room.occasion][1]}...</p><${Btn} className="mt-7 text-lg" onClick=${()=>{ctx();playTune(room.occasion);setTimeout(stopTune,5000);setGo(true)}}>Start / শুরু করুন<//>
<p className="mt-5 text-[11px] text-amber-100/40">Room ${id}</p></div>`;
else body=h`<${Experience} key=${id} room=${room} patch=${patch}/>`;
return h`<div className="relative min-h-full w-full flex items-center justify-center px-4 py-6"><${Dust}/><div className="relative z-10 w-full flex justify-center">${body}</div></div>`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
